<div class="detail-container">

  <h1>🎬 Drama Details</h1>

  <div class="drama-card">

    <div class="detail-top">

      <img
        [src]="bild"
        [alt]="name"
        class="detail-image">

      <div class="drama-info">

        <h2>{{ name }}</h2>

        <p>
          <strong>Status:</strong>
          {{ status }}
        </p>

        <p>
          <strong>Bewertung:</strong>
          {{ bewertung }}
        </p>

        <p>
          <strong>Folgen:</strong>
          {{ folgen }}
        </p>

        <p>
          <strong>Genre:</strong>
          {{ genre }}
        </p>

      </div>

    </div>

    <div class="description">

      <h3>Beschreibung</h3>

      <p>{{ beschreibung }}</p>

    </div>

    <div class="buttons">

      <button [routerLink]="['/edit-drama', dramaId]">
        ✏️ Bearbeiten
      </button>

      <button [routerLink]="['/delete-drama', dramaId]">
        🗑️ Löschen
      </button>

      <button routerLink="/dramas">
        ← Zurück
      </button>

    </div>

  </div>

</div>
