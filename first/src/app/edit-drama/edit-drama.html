<div class="edit-container">

  <h1>✏️ Drama bearbeiten</h1>

  <div class="edit-card">

    <label>Name</label>
    <input type="text" [(ngModel)]="name">

    <label>Status</label>
    <select [(ngModel)]="status">
      <option>Geschaut</option>
      <option>Gerade dabei</option>
      <option>Noch offen</option>
    </select>

    <label>Bewertung</label>
    <input type="text" [(ngModel)]="bewertung">

    <label>Folgen</label>
    <input type="number" [(ngModel)]="folgen">

    <label>Genre</label>
    <input type="text" [(ngModel)]="genre">

    <label>Beschreibung</label>
    <textarea [(ngModel)]="beschreibung"></textarea>

    <div class="buttons">

      <button class="save">
        💾 Speichern
      </button>

      <button routerLink="/dramas">
        ✖ Abbrechen
      </button>

    </div>

  </div>

</div>
